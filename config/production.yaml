system:
  name: "multi-agent-engineering-system"
  version: "0.1.0"
  environment: "production"

architecture:
  layers:
    - name: "input_layer"
      description: "输入收敛层"
      dependencies: ["scheduler"]
    - name: "scheduler"
      description: "调度中枢层"
      dependencies: ["agents"]
    - name: "agents"
      description: "智能协作层"
      dependencies: ["executors"]
    - name: "executors"
      description: "原子执行层"
      dependencies: []

dependencies:
  allowed:
    input_layer: ["scheduler"]
    scheduler: ["agents"]
    agents: ["executors"]
    executors: []
    core: ["input_layer", "scheduler", "agents", "executors"]

python:
  version: ">=3.11"
  encoding: "utf-8"

logging:
  level: "WARNING"
  format: "json"
  output: "file"
  file_path: "logs/app.log"
